<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Customer Portal - SmartSolar{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Base template ke head mein yeh line add karein -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body class="bg-[#fcfbf7] font-sans text-gray-800 antialiased">

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR NAVIGATION -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between shadow-sm z-20">
            <div>
                <!-- Logo -->
                <div class="p-6 flex items-center space-x-3 border-b border-gray-100">
                    <div class="w-9 h-9 bg-amber-500 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-md">
                        <i class="fa-solid fa-sun"></i>
                    </div>
                    <span class="text-xl font-bold text-gray-900 tracking-tight">Smart<span class="text-amber-600">Solar</span></span>
                </div>

                <!-- Navigation Links -->
                <nav class="mt-6 px-4 space-y-1">
                    <a href="{{ url_for('customers.dashboard') }}" class="flex items-center space-x-3 px-4 py-3 text-gray-600 hover:bg-amber-50 hover:text-amber-600 rounded-xl font-medium transition">
                        <i class="fa-solid fa-house w-5 text-center"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="{{ url_for('customers.view_projects') }}" class="flex items-center space-x-3 px-4 py-3 bg-amber-500 text-white rounded-xl font-medium shadow-sm transition">
                        <i class="fa-solid fa-diagram-project w-5 text-center"></i>
                        <span>My Projects</span>
                    </a>
                    <a href="{{ url_for('quotations.list_quotations') }}" class="flex items-center space-x-3 px-4 py-3 text-gray-600 hover:bg-amber-50 hover:text-amber-600 rounded-xl font-medium transition">
                        <i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i>
                        <span>Quotations</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-600 hover:bg-amber-50 hover:text-amber-600 rounded-xl font-medium transition">
                        <i class="fa-solid fa-calculator w-5 text-center"></i>
                        <span>Load Calculator</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-600 hover:bg-amber-50 hover:text-amber-600 rounded-xl font-medium transition">
                        <i class="fa-solid fa-calendar-check w-5 text-center"></i>
                        <span>Book Survey</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-600 hover:bg-amber-50 hover:text-amber-600 rounded-xl font-medium transition">
                        <i class="fa-solid fa-box-open w-5 text-center"></i>
                        <span>Packages</span>
                    </a>
                </nav>
            </div>

            <!-- Footer Sidebar info -->
            <div class="p-4 border-t border-gray-100">
                <div class="bg-amber-50 rounded-xl p-3 text-xs text-amber-800 flex items-center justify-between">
                    <span>Need Support?</span>
                    <a href="#" class="font-bold underline">Contact Us</a>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <!-- TOP NAVBAR -->
            <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-8 z-10">
                <div class="flex items-center space-x-4">
                    <h1 class="text-lg font-semibold text-gray-800">{% block header_title %}Customer Portal{% endblock %}</h1>
                </div>

                <!-- Profile Dropdown Right Side -->
                <div class="relative" x-data="{ open: false }">
                    <button @click="open = !open" class="flex items-center space-x-3 focus:outline-none bg-gray-50 hover:bg-gray-100 p-1.5 pr-3 rounded-full border border-gray-200 transition">
                        <div class="w-8 h-8 rounded-full bg-amber-600 text-white font-bold flex items-center justify-center text-sm shadow-sm">
                            {{ current_user.name[0] if current_user.name else 'U' }}
                        </div>
                        <span class="text-sm font-medium text-gray-700 hidden sm:inline">{{ current_user.name }}</span>
                        <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
                    </button>

                    <!-- Profile Menu Dropdown -->
                    <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 py-1 z-50">
                        <div class="px-4 py-2 border-b border-gray-100">
                            <p class="text-xs text-gray-500">Signed in as</p>
                            <p class="text-sm font-semibold text-gray-800 truncate">{{ current_user.email }}</p>
                        </div>
                        <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50"><i class="fa-regular fa-user mr-2"></i> Profile Settings</a>
                        <a href="{{ url_for('auth.logout') }}" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50"><i class="fa-solid fa-right-from-bracket mr-2"></i> Logout</a>
                    </div>
                </div>
            </header>

            <!-- MAIN BODY PAGE -->
            <main class="flex-1 overflow-y-auto p-8 bg-[#fcfbf7]">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Dropdown Script -->
    <script>
        document.querySelector('button').addEventListener('click', function() {
            document.getElementById('profileDropdown').classList.toggle('hidden');
        });
    </script>
</body>
</html>
