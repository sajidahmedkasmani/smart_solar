        </h3>
        <p class="text-sm mb-6" style="color: var(--ink-soft);">Schedule an engineering site survey to check roof orientation, shading conditions, and electrical setup.</p>

        <form action="" method="POST" class="space-y-4">
            <!-- Property & Contact Info -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold mb-1">Contact Person</label>
                    <input type="text" name="contact_person" value="" required class="w-full p-2.5 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Property Type</label>
                    <select name="property_type" class="w-full p-2.5 border rounded-lg text-sm">
                        <option value="Residential - Double Storey">Residential (Double Storey)</option>
                        <option value="Residential - Single Storey">Residential (Single Storey)</option>
                        <option value="Commercial Roof">Commercial Roof</option>
                        <option value="Agricultural Field">Agricultural Field</option>
                    </select>
                </div>
            </div>

            <!-- Date & Time Slot Selection -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold mb-1">Preferred Date</label>
                    <input type="date" name="preferred_date" id="survey_date" required class="w-full p-2.5 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Available Time Slot</label>
                    <select name="time_slot" class="w-full p-2.5 border rounded-lg text-sm">
                        <option value=" Morning (09:00 AM - 12:00 PM)">Morning (09:00 AM - 12:00 PM)</option>
                        <option value="Afternoon (12:00 PM - 03:00 PM)">Afternoon (12:00 PM - 03:00 PM)</option>
                        <option value="Evening (03:00 PM - 06:00 PM)">Evening (03:00 PM - 06:00 PM)</option>
                    </select>
                </div>
            </div>

            <!-- Full Address & Instructions -->
            <div>
                <label class="block text-xs font-semibold mb-1">Site Address</label>
                <textarea name="address" rows="2" placeholder="House/Plot #, Street, Area, City" required class="w-full p-2.5 border rounded-lg text-sm"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold mb-1">Special Instructions (Optional)</label>
                <input type="text" name="special_instructions" placeholder="e.g. Call before arrival / Roof access via side stairs" class="w-full p-2.5 border rounded-lg text-sm">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl shadow-md transition">
                Confirm & Book Survey Request
            </button>
        </form>
    </div>
</div>


<script>
    const dateInput = document.getElementById('survey_date');

    // 1. Min attribute set karein (Past dates disable karne ke liye)
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    dateInput.setAttribute('min', todayStr);

    // 2. Value set karein (Next Day/Kal ki date auto-select karne ke liye)
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1); // 1 din add kar diya
    const tomorrowStr = tomorrow.toISOString().split('T')[0];
    
    // Default selected value = Tomorrow
    dateInput.value = tomorrowStr;

    // Direct Aaj ki date auto-select karni ho to neeche wali line uncomment kar lein:
    dateInput.value = todayStr;

    // Extra Front-end Check (Agar user manual change kare)
    dateInput.addEventListener('change', function() {
        if (this.value < todayStr) {
            alert('Past dates allowed nahi hain!');
            this.value = tomorrowStr;
        }
    });
</script>
