<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Dashboard{% endblock %}  — Customer Portal — {{ APP_NAME }}</title>
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Base template ke head mein yeh line add karein -->
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>

    <body class="bg-[#fcfbf7] font-sans text-gray-800 antialiased">
        <div class="flex h-screen overflow-hidden">
            
            <!-- SIDEBAR NAVIGATION -->
                {% include 'landing_page/customer/layout/sidebar.html' %}
            <!-- SIDEBAR NAVIGATION -->

            <!-- MAIN CONTENT AREA -->
                <div class="flex-1 flex flex-col min-w-0 overflow-hidden">              
                    <!-- TOP NAVBAR -->
                        <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-8 z-10">
                            <div class="flex items-center space-x-4">
                                <h1 class="text-lg font-semibold text-gray-800">{% block header_title %}{% endblock %}</h1>
                            </div>

                            <!-- Profile Dropdown Right Side -->
                            <div class="relative" x-data="{ open: false }">
                                <button @click="open = !open" class="flex items-center space-x-3 focus:outline-none bg-gray-50 hover:bg-gray-100 p-1.5 pr-3 rounded-full border border-gray-200 transition">
                                    <div class="w-8 h-8 rounded-full bg-amber-600 text-white font-bold flex items-center justify-center text-sm shadow-sm">
                                        <!-- {{ current_user.name[0] if current_user.name else 'U' }} -->
                                        {{ session.get('user_name', 'U')[:1].upper() }}
                                    </div>
                                    <span class="text-sm font-medium text-gray-700 hidden sm:inline"></span>
                                    <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
                                </button>

                                <!-- Profile Menu Dropdown -->
                                <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 py-1 z-50">
                                    <div class="px-4 py-2 border-b border-gray-100">
                                        <p class="text-xs text-gray-500">Signed in as</p>
                                        <p class="text-sm font-semibold text-gray-800 truncate">{{ current_user.email }}
                                        {{ session.get('user_name', 'User') }}
                                        </p>
                                    </div>
                                    <a href="{{ url_for('customers.profile') }}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50"><i class="fa-regular fa-user mr-2"></i> Profile Settings</a>
                                    <a href="{{ url_for('auth.logout') }}" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50"><i class="fa-solid fa-right-from-bracket mr-2"></i> Logout</a>
                                </div>
                            </div>
                        </header>
                    <!-- TOP NAVBAR -->

                    <!-- MAIN BODY PAGE -->
                        <main class="flex-1 overflow-y-auto p-8 bg-[#fcfbf7]">
                            {% block content %}{% endblock %}
                        </main>
                    <!-- MAIN BODY PAGE -->
                </div>
            <!-- MAIN CONTENT AREA -->
        </div>

        <script>
            document.querySelector('button').addEventListener('click', function() {
                document.getElementById('profileDropdown').classList.toggle('hidden');
            });
        </script>

        <!-- ============ LIVE CHAT WIDGET ============ -->
        {% include 'landing_page/layout/chat_widget.html' %}
    </body>
</html>
